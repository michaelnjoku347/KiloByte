name: CI

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          cd "$RUNNER_TEMP/emsdk"
          ./emsdk install 4.0.11
          ./emsdk activate 4.0.11
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - name: Build WebAssembly games
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          npm run build:wasm
      - run: npm run build
      - name: Reject secrets in the browser bundle
        run: |
          if grep -R -E "AIza[0-9A-Za-z_-]{20}|eyJ[A-Za-z0-9_-]{20,}\\.[A-Za-z0-9_-]{10,}" dist --include='*.js' --include='*.html'; then
            echo "A key leaked into dist/"
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
