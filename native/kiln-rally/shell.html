<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Kiln Rally</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #1c120c;
        color: #f3ead7;
        font-family: ui-monospace, monospace;
        overflow: hidden;
      }
      #status {
        position: absolute;
        left: 0;
        right: 0;
        top: 42%;
        text-align: center;
        letter-spacing: 0.08em;
        font-size: 13px;
      }
      canvas {
        border: 0;
        width: 100%;
        height: 100%;
        display: block;
        background: #1c120c;
        outline: none;
      }
    </style>
  </head>
  <body>
    <div id="status">Firing the kiln…</div>
    <canvas id="canvas" width="960" height="540" tabindex="0"></canvas>
    <script>
      var statusElement = document.getElementById('status')
      var canvasElement = document.getElementById('canvas')
      canvasElement.addEventListener('webglcontextlost', function (e) {
        e.preventDefault()
        statusElement.textContent = 'The picture stalled. Reload the frame.'
      }, false)
      var Module = {
        canvas: canvasElement,
        print: function () {},
        printErr: function (text) { console.warn(text) },
        setStatus: function (text) {
          if (!text) statusElement.style.display = 'none'
          else {
            statusElement.style.display = 'block'
            statusElement.textContent = text
          }
        },
      }
      Module.setStatus('Firing the kiln…')
    </script>
    {{{ SCRIPT }}}
  </body>
</html>
